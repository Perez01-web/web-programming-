<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/zere.css">
    <title>HTML AND CSS EXERCISE</title>
</head>
<body>

    <div class="container">
        <div class="button">
            <button class="signup">Sign up to continue</button>
        </div>
    </div>

    <div class="number2">
        <div class="form-container">
            <!-- make form and map inline -->
            <div class="form">
                <form action="">
                    <h1 class="form-heading">Contact Us</h1>
                    <!-- make full name and email inputs inline -->
                    <div class="name-email-inputs">
                        <div class="name">
                            <label for="fname">FULL NAME</label>
                            <input type="text" id="fname" name="fname" placeholder="Enter your full name" required>
                        </div>
                        <div class="email">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                        </div>
                    </div>

                    <div class="title">
                        <label for="subject">SUBJECT</label>
                        <input type="text" id="subject" name="subject" placeholder="Enter the subject of your message" required>
                    </div>

                    <div class="main-message">
                        <label for="message">MESSAGE</label>
                        <textarea name="message" id="message" placeholder="Enter your message here" required></textarea>
                    </div>

                    <div class="submit-button">
                        <button type="submit">Send Message</button>
                    </div>
                </form>
            </div>

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4479.217917698879!2d35.015868300596246!3d-15.801654285262943!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x18d845be757f6163%3A0x23bcdea658de17e7!2sKamuzu%20University%20of%20Health%20Sciences%20(KUHeS)!5e0!3m2!1sen!2smw!4v1771888781822!5m2!1sen!2smw" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </div>
    
    
</body>
</html>
